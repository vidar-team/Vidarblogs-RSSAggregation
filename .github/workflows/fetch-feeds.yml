name: Update feeds

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch feeds (incremental)
        run: npm run fetch

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/posts script/feeds.cache.json public/feed.xml
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update feeds"
            git push
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      # Only rebuild + deploy when the fetch actually produced changes.
      - name: Build static site
        if: steps.commit.outputs.updated == 'true'
        env:
          STATIC_EXPORT: "1"
        run: npm run build

      - name: Publish static site to deploy repository
        if: steps.commit.outputs.updated == 'true'
        env:
          DEPLOY_REPO: ${{ vars.DEPLOY_REPO || secrets.DEPLOY_REPO }}
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_BRANCH: ${{ vars.DEPLOY_BRANCH || 'main' }}
          DEPLOY_CNAME: ${{ vars.DEPLOY_CNAME }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_REPO" ] || [ -z "$DEPLOY_TOKEN" ]; then
            echo "DEPLOY_REPO / DEPLOY_TOKEN not configured; skipping deploy."
            exit 0
          fi

          # GitHub Pages ignores paths starting with "_" (e.g. _next) unless
          # Jekyll is disabled.
          touch out/.nojekyll
          if [ -n "$DEPLOY_CNAME" ]; then
            printf '%s\n' "$DEPLOY_CNAME" > out/CNAME
          fi

          cd out
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add target "https://x-access-token:${DEPLOY_TOKEN}@github.com/${DEPLOY_REPO}.git"

          # Base on the existing deploy branch when present so the push is a
          # fast-forward; fall back to a fresh branch for a brand-new repo.
          git fetch --depth=1 target "$DEPLOY_BRANCH" 2>/dev/null || true
          if git rev-parse --verify -q FETCH_HEAD >/dev/null; then
            git reset -q --mixed FETCH_HEAD
          else
            git checkout -q -b "$DEPLOY_BRANCH"
          fi

          git add -A
          git commit -q -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push target "HEAD:$DEPLOY_BRANCH"
