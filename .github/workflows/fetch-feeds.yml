name: Update feeds

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    outputs:
      updated: ${{ steps.commit.outputs.updated }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Fetch feeds (incremental)
        run: npm run fetch

      - name: Commit changes
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/posts script/feeds.cache.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: update feeds"
            git push
            echo "updated=true" >> "$GITHUB_OUTPUT"
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: fetch
    if: needs.fetch.outputs.updated == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      ref: ${{ needs.fetch.outputs.sha }}
    secrets: inherit
